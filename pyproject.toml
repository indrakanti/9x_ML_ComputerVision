[tool.pytest.ini_options]
testpaths = ["00_Setup/tests", "01_TensorsMemory/tests", "02_ProbabilityStatistics/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "build", "build-native", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true
