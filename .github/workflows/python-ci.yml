name: ML CV CPU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            ffmpeg libgl1 libglib2.0-0 libopencv-dev

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install course dependencies
        run: |
          python -m pip install -r requirements/base.txt
          python -m pip install -r requirements/dev.txt
          python -m pip install -r requirements/onnx.txt
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Validate helper scripts
        run: bash -n setup.sh course.sh preflight.sh

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Environment sanity
        run: python 00_Setup/python/environment_check.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy [0-9][0-9]_*/python

      - name: Pytest / CPU PyTorch correctness
        run: pytest

      - name: Configure native C++
        run: |
          cmake -S . -B build-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCV9X_WARNINGS_AS_ERRORS=ON

      - name: Build native C++
        run: cmake --build build-native --parallel

      - name: Python ↔ C++ numerical parity
        run: |
          python 02_ProbabilityStatistics/python/statistics_native_parity.py \
            build-native/02_ProbabilityStatistics/cv9x_statistics
          python 03_Optimization/python/optimization_native_parity.py \
            build-native/03_Optimization/cv9x_optimizer_state
          python 04_Autograd/python/autodiff_native_parity.py \
            build-native/04_Autograd/cv9x_autodiff
          python 05_DataDiscipline/python/data_discipline_native_parity.py \
            build-native/05_DataDiscipline/cv9x_data_discipline
          python 06_LinearClassifiers/python/linear_classifier_native_parity.py \
            build-native/06_LinearClassifiers/cv9x_linear_classifier \
            06_LinearClassifiers/artifacts/linear_binary_model.txt
          python 07_MLPs/python/mlp_native_parity.py \
            build-native/07_MLPs/cv9x_mlp \
            07_MLPs/artifacts/mlp_binary_model.txt
          python 08_Convolution/python/convolution_native_parity.py \
            build-native/08_Convolution/cv9x_convolution
          python 09_CNNTraining/python/cnn_training_native_parity.py \
            build-native/09_CNNTraining/cv9x_tiny_cnn \
            09_CNNTraining/artifacts/tiny_cnn_smoke.txt
          python 10_TrainingRobustness/python/training_robustness_native_parity.py \
            build-native/10_TrainingRobustness/cv9x_deployment_manifest \
            10_TrainingRobustness/artifacts/deployment_manifest.txt
          python 11_TransferLearningONNX/python/transfer_learning_native_parity.py \
            build-native/11_TransferLearningONNX/cv9x_transfer_model \
            11_TransferLearningONNX/artifacts/transfer_model_smoke.txt
          python 12_ResNet/python/residual_learning_native_parity.py \
            build-native/12_ResNet/cv9x_residual_block \
            12_ResNet/artifacts/residual_block.txt
          python 13_EfficientCNN/python/efficient_cnn_native_parity.py \
            build-native/13_EfficientCNN/cv9x_depthwise_separable \
            13_EfficientCNN/artifacts/depthwise_separable.txt
          python 14_VisionTransformer/python/vision_transformer_native_parity.py \
            build-native/14_VisionTransformer/cv9x_tiny_vit \
            14_VisionTransformer/artifacts/tiny_vit.txt
          python 15_WindowedTransformers/python/window_attention_native_parity.py \
            build-native/15_WindowedTransformers/cv9x_window_attention \
            15_WindowedTransformers/artifacts/window_attention.txt
          python 16_HybridBackbones/python/hybrid_backbone_native_parity.py \
            build-native/16_HybridBackbones/cv9x_hybrid_backbone \
            16_HybridBackbones/artifacts/hybrid.txt
          python 17_BackboneEvaluation/python/backbone_eval_native_parity.py \
            build-native/17_BackboneEvaluation/cv9x_backbone_eval \
            17_BackboneEvaluation/artifacts/backbones.txt
          python 18_DetectionFundamentals/python/detection_native_parity.py \
            build-native/18_DetectionFundamentals/cv9x_detection_fundamentals \
            18_DetectionFundamentals/artifacts/detections.txt
          python 19_YOLOOneStage/python/yolo_native_parity.py \
            build-native/19_YOLOOneStage/cv9x_yolo_decode \
            19_YOLOOneStage/artifacts/yolo_head.txt
          python 20_TwoStageDetection/python/two_stage_native_parity.py \
            build-native/20_TwoStageDetection/cv9x_two_stage \
            20_TwoStageDetection/artifacts/proposals.txt
          python 21_DETR/python/detr_native_parity.py \
            build-native/21_DETR/cv9x_detr_match \
            21_DETR/artifacts/matching.txt
          python 22_SemanticSegmentation/python/semantic_native_parity.py \
            build-native/22_SemanticSegmentation/cv9x_semantic_metrics \
            22_SemanticSegmentation/artifacts/segmentation.txt
          python 23_InstancePanoptic/python/panoptic_native_parity.py \
            build-native/23_InstancePanoptic/cv9x_panoptic_compose \
            23_InstancePanoptic/artifacts/panoptic.txt
          python 24_PromptableSegmentation/python/promptable_native_parity.py \
            build-native/24_PromptableSegmentation/cv9x_promptable_mask \
            24_PromptableSegmentation/artifacts/promptable.txt
          python 25_PoseEstimation/python/pose_native_parity.py \
            build-native/25_PoseEstimation/cv9x_pose_decode \
            25_PoseEstimation/artifacts/pose.txt
          python 26_ContrastiveCLIP/python/clip_native_parity.py \
            build-native/26_ContrastiveCLIP/cv9x_clip_similarity \
            26_ContrastiveCLIP/artifacts/embeddings.txt

      - name: Test native C++
        run: ctest --test-dir build-native --output-on-failure
