name: ML CV CPU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            ffmpeg libgl1 libglib2.0-0 libopencv-dev

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install course dependencies
        run: |
          python -m pip install -r requirements/base.txt
          python -m pip install -r requirements/dev.txt
          python -m pip install -r requirements/onnx.txt
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Validate helper scripts
        run: bash -n setup.sh course.sh preflight.sh

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Environment sanity
        run: python 01_Foundations_to_Modern_Vision/00_Setup/python/environment_check.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: |
          mypy 01_Foundations_to_Modern_Vision/[0-9][0-9]_*/python
          mypy 02_Multimodal_3D_and_Generative_Vision/[0-9][0-9]_*/python

      - name: Pytest / CPU PyTorch correctness
        run: pytest

      - name: Download native ONNX Runtime SDK (pinned)\n        run: |\n          mkdir -p build-deps\n          curl --fail --location --silent --show-error --retry 3 \\\n            https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz \\\n            --output build-deps/onnxruntime.tgz\n          tar -xzf build-deps/onnxruntime.tgz -C build-deps\n\n      - name: Configure native C++
        run: |
          cmake -S . -B build-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCV9X_WARNINGS_AS_ERRORS=ON \\\n            -DCV9X_ONNXRUNTIME_ROOT=$GITHUB_WORKSPACE/build-deps/onnxruntime-linux-x64-1.20.1

      - name: Build native C++
        run: cmake --build build-native --parallel

      - name: Python ↔ C++ numerical parity
        run: |
          python 01_Foundations_to_Modern_Vision/02_ProbabilityStatistics/python/statistics_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/02_ProbabilityStatistics/cv9x_statistics
          python 01_Foundations_to_Modern_Vision/03_Optimization/python/optimization_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/03_Optimization/cv9x_optimizer_state
          python 01_Foundations_to_Modern_Vision/04_Autograd/python/autodiff_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/04_Autograd/cv9x_autodiff
          python 01_Foundations_to_Modern_Vision/05_DataDiscipline/python/data_discipline_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/05_DataDiscipline/cv9x_data_discipline
          python 01_Foundations_to_Modern_Vision/06_LinearClassifiers/python/linear_classifier_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/06_LinearClassifiers/cv9x_linear_classifier \
            01_Foundations_to_Modern_Vision/06_LinearClassifiers/artifacts/linear_binary_model.txt
          python 01_Foundations_to_Modern_Vision/07_MLPs/python/mlp_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/07_MLPs/cv9x_mlp \
            01_Foundations_to_Modern_Vision/07_MLPs/artifacts/mlp_binary_model.txt
          python 01_Foundations_to_Modern_Vision/08_Convolution/python/convolution_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/08_Convolution/cv9x_convolution
          python 01_Foundations_to_Modern_Vision/09_CNNTraining/python/cnn_training_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/09_CNNTraining/cv9x_tiny_cnn \
            01_Foundations_to_Modern_Vision/09_CNNTraining/artifacts/tiny_cnn_smoke.txt
          python 01_Foundations_to_Modern_Vision/10_TrainingRobustness/python/training_robustness_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/10_TrainingRobustness/cv9x_deployment_manifest \
            01_Foundations_to_Modern_Vision/10_TrainingRobustness/artifacts/deployment_manifest.txt
          python 01_Foundations_to_Modern_Vision/11_TransferLearningONNX/python/transfer_learning_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/11_TransferLearningONNX/cv9x_transfer_model \
            01_Foundations_to_Modern_Vision/11_TransferLearningONNX/artifacts/transfer_model_smoke.txt
          python 01_Foundations_to_Modern_Vision/12_ResNet/python/residual_learning_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/12_ResNet/cv9x_residual_block \
            01_Foundations_to_Modern_Vision/12_ResNet/artifacts/residual_block.txt
          python 01_Foundations_to_Modern_Vision/13_EfficientCNN/python/efficient_cnn_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/13_EfficientCNN/cv9x_depthwise_separable \
            01_Foundations_to_Modern_Vision/13_EfficientCNN/artifacts/depthwise_separable.txt
          python 01_Foundations_to_Modern_Vision/14_VisionTransformer/python/vision_transformer_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/14_VisionTransformer/cv9x_tiny_vit \
            01_Foundations_to_Modern_Vision/14_VisionTransformer/artifacts/tiny_vit.txt
          python 01_Foundations_to_Modern_Vision/15_WindowedTransformers/python/window_attention_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/15_WindowedTransformers/cv9x_window_attention \
            01_Foundations_to_Modern_Vision/15_WindowedTransformers/artifacts/window_attention.txt
          python 01_Foundations_to_Modern_Vision/16_HybridBackbones/python/hybrid_backbone_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/16_HybridBackbones/cv9x_hybrid_backbone \
            01_Foundations_to_Modern_Vision/16_HybridBackbones/artifacts/hybrid.txt
          python 01_Foundations_to_Modern_Vision/17_BackboneEvaluation/python/backbone_eval_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/17_BackboneEvaluation/cv9x_backbone_eval \
            01_Foundations_to_Modern_Vision/17_BackboneEvaluation/artifacts/backbones.txt
          python 01_Foundations_to_Modern_Vision/18_DetectionFundamentals/python/detection_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/18_DetectionFundamentals/cv9x_detection_fundamentals \
            01_Foundations_to_Modern_Vision/18_DetectionFundamentals/artifacts/detections.txt
          python 01_Foundations_to_Modern_Vision/19_YOLOOneStage/python/yolo_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/19_YOLOOneStage/cv9x_yolo_decode \
            01_Foundations_to_Modern_Vision/19_YOLOOneStage/artifacts/yolo_head.txt
          python 01_Foundations_to_Modern_Vision/20_TwoStageDetection/python/two_stage_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/20_TwoStageDetection/cv9x_two_stage \
            01_Foundations_to_Modern_Vision/20_TwoStageDetection/artifacts/proposals.txt
          python 01_Foundations_to_Modern_Vision/21_DETR/python/detr_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/21_DETR/cv9x_detr_match \
            01_Foundations_to_Modern_Vision/21_DETR/artifacts/matching.txt
          python 01_Foundations_to_Modern_Vision/22_SemanticSegmentation/python/semantic_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/22_SemanticSegmentation/cv9x_semantic_metrics \
            01_Foundations_to_Modern_Vision/22_SemanticSegmentation/artifacts/segmentation.txt
          python 01_Foundations_to_Modern_Vision/23_InstancePanoptic/python/panoptic_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/23_InstancePanoptic/cv9x_panoptic_compose \
            01_Foundations_to_Modern_Vision/23_InstancePanoptic/artifacts/panoptic.txt
          python 01_Foundations_to_Modern_Vision/24_PromptableSegmentation/python/promptable_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/24_PromptableSegmentation/cv9x_promptable_mask \
            01_Foundations_to_Modern_Vision/24_PromptableSegmentation/artifacts/promptable.txt
          python 01_Foundations_to_Modern_Vision/25_PoseEstimation/python/pose_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/25_PoseEstimation/cv9x_pose_decode \
            01_Foundations_to_Modern_Vision/25_PoseEstimation/artifacts/pose.txt
          python 01_Foundations_to_Modern_Vision/26_ContrastiveCLIP/python/clip_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/26_ContrastiveCLIP/cv9x_clip_similarity \
            01_Foundations_to_Modern_Vision/26_ContrastiveCLIP/artifacts/embeddings.txt
          python 01_Foundations_to_Modern_Vision/27_MaskedImageModeling/python/mim_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/27_MaskedImageModeling/cv9x_mim_reconstruct \
            01_Foundations_to_Modern_Vision/27_MaskedImageModeling/artifacts/mim.txt
          python 01_Foundations_to_Modern_Vision/28_DINO/python/dino_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/28_DINO/cv9x_dino_math \
            01_Foundations_to_Modern_Vision/28_DINO/artifacts/dino.txt
          python 01_Foundations_to_Modern_Vision/29_FoundationBackbones/python/foundation_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/29_FoundationBackbones/cv9x_foundation_adapters \
            01_Foundations_to_Modern_Vision/29_FoundationBackbones/artifacts/foundation.txt
          python 01_Foundations_to_Modern_Vision/30_PEFT/python/peft_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/30_PEFT/cv9x_peft_math \
            01_Foundations_to_Modern_Vision/30_PEFT/artifacts/peft.txt
          python 01_Foundations_to_Modern_Vision/31_Compression/python/compression_native_parity.py \
            build-native/01_Foundations_to_Modern_Vision/31_Compression/cv9x_compression_math \
            01_Foundations_to_Modern_Vision/31_Compression/artifacts/compression.txt

      - name: Part 2 Python ↔ C++ numerical parity
        run: |
          python 02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/python/zero_shot_native_parity.py \
            build-native/02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/cpp/cv9x_module32_zero_shot

          python 02_Multimodal_3D_and_Generative_Vision/33_ImageCaptioning/python/captioning_native_parity.py \
            build-native/02_Multimodal_3D_and_Generative_Vision/33_ImageCaptioning/cpp/cv9x_module33_captioning

          python 02_Multimodal_3D_and_Generative_Vision/34_VisualQuestionAnswering/python/vqa_native_parity.py \
            build-native/02_Multimodal_3D_and_Generative_Vision/34_VisualQuestionAnswering/cpp/cv9x_module34_vqa

          python 02_Multimodal_3D_and_Generative_Vision/35_VisionLanguageModels/python/vlm_native_parity.py \
            build-native/02_Multimodal_3D_and_Generative_Vision/35_VisionLanguageModels/cpp/cv9x_module35_vlm

      - name: Module 32 train/export/native deployment smoke\n        run: |\n          python 02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/python/production.py train \\\n            --dataset synthetic --epochs 1 --batch-size 20 --output build-native/module32-smoke\n          python 02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/python/production.py export \\\n            --checkpoint build-native/module32-smoke/model.pt --output build-native/module32-smoke/export\n          python 02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/python/production_native_parity.py \\\n            build-native/02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/cpp/cv9x_module32_onnx \\\n            build-native/module32-smoke/export\n\n      - name: Test native C++
        run: ctest --test-dir build-native --output-on-failure
