name: ML CV CPU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            ffmpeg libgl1 libglib2.0-0 libopencv-dev

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install course dependencies
        run: |
          python -m pip install -r requirements/base.txt
          python -m pip install -r requirements/dev.txt
          python -m pip install -r requirements/onnx.txt
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Validate helper scripts
        run: bash -n setup.sh course.sh preflight.sh

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Environment sanity
        run: python 00_Setup/python/environment_check.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy [0-9][0-9]_*/python

      - name: Pytest / CPU PyTorch correctness
        run: pytest

      - name: Configure native C++
        run: |
          cmake -S . -B build-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCV9X_WARNINGS_AS_ERRORS=ON

      - name: Build native C++
        run: cmake --build build-native --parallel

      - name: Python ↔ C++ numerical parity
        run: |
          python 02_ProbabilityStatistics/python/statistics_native_parity.py \
            build-native/02_ProbabilityStatistics/cv9x_statistics
          python 03_Optimization/python/optimization_native_parity.py \
            build-native/03_Optimization/cv9x_optimizer_state
          python 04_Autograd/python/autodiff_native_parity.py \
            build-native/04_Autograd/cv9x_autodiff
          python 05_DataDiscipline/python/data_discipline_native_parity.py \
            build-native/05_DataDiscipline/cv9x_data_discipline

      - name: Test native C++
        run: ctest --test-dir build-native --output-on-failure
