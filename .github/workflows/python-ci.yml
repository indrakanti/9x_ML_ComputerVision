name: ML CV CPU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            ffmpeg libgl1 libglib2.0-0 libopencv-dev

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install course dependencies
        run: |
          python -m pip install -r requirements/base.txt
          python -m pip install -r requirements/dev.txt
          python -m pip install -r requirements/onnx.txt
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .

      - name: Environment sanity
        run: python tools/environment_check.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src tools

      - name: Pytest
        run: pytest --cov=cv9x_mlcv --cov-report=term-missing

      - name: Configure native C++
        run: cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build native C++
        run: cmake --build build-native --parallel

      - name: Test native C++
        run: ctest --test-dir build-native --output-on-failure
