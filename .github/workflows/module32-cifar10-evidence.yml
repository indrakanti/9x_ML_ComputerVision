name: Module 32 Real CIFAR-10 Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/**'
      - '.github/workflows/module32-cifar10-evidence.yml'
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs for small reproducible CIFAR-10 run"
        required: false
        default: "3"
      max_train:
        description: "Number of official training images (0 = all)"
        required: false
        default: "2000"
      max_test:
        description: "Number of official test images (0 = all)"
        required: false
        default: "500"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cifar10-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install training and export runtime
        run: |
          python -m pip install numpy pillow onnx onnxruntime
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch immutable CIFAR-10 archive with checksum
        timeout-minutes: 10
        run: |
          mkdir -p data/cifar10
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 \
            https://huggingface.co/datasets/MIT-OL-AI-D/cifar-10-python/resolve/c6e562aecc3a2dd5ee13f9d91630d81219c6a126/cifar-10-python.tar.gz \
            --output data/cifar10/cifar-10-python.tar.gz
          echo "c58f30108f718f92721af3b95e74349a  data/cifar10/cifar-10-python.tar.gz" \
            | md5sum --check
          tar -xzf data/cifar10/cifar-10-python.tar.gz -C data/cifar10
      - name: Train and evaluate official CIFAR-10 split
        run: |
          python 02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/python/production.py train \
            --dataset cifar10 --download --epochs "${{ inputs.epochs || '3' }}" \
            --max-train "${{ inputs.max_train || '2000' }}" --max-test "${{ inputs.max_test || '500' }}" \
            --seed 42 --output runs/module32-cifar10
      - name: Validate ONNX export against trained PyTorch checkpoint
        run: |
          python 02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/python/production.py export \
            --checkpoint runs/module32-cifar10/model.pt \
            --output runs/module32-cifar10/export
      - name: Evaluate a held-out real image and benchmark ONNX CPU
        run: |
          python - <<'PY'
          from pathlib import Path
          from torchvision import datasets
          root = Path("runs/module32-cifar10")
          dataset = datasets.CIFAR10(root="data/cifar10", train=False, download=False)
          image, label = dataset[0]
          image.save(root / "heldout_sample.png")
          (root / "heldout_label.txt").write_text(str(label) + "\n")
          PY
          python 02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/python/infer_benchmark.py \
            --export-dir runs/module32-cifar10/export \
            --image runs/module32-cifar10/heldout_sample.png --warmup 3 --repeats 30 \
            > runs/module32-cifar10/cpu_benchmark.json
          python 02_Multimodal_3D_and_Generative_Vision/32_TextImageEmbeddings/python/artifact_contract.py \
            --export-dir runs/module32-cifar10/export
      - name: Save trained weights, metrics and reproducibility manifest
        uses: actions/upload-artifact@v4
        with:
          name: module32-cifar10-evidence
          path: |
            runs/module32-cifar10/model.pt
            runs/module32-cifar10/metrics.json
            runs/module32-cifar10/cpu_benchmark.json
            runs/module32-cifar10/heldout_label.txt
            runs/module32-cifar10/export/manifest.json
            runs/module32-cifar10/export/image.onnx
            runs/module32-cifar10/export/text.onnx
          retention-days: 14
